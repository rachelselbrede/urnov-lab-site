# Keeps the News section current. Once a day this asks the IGI website for stories that
# mention the lab, writes the newest ones to news.json, and commits that file if it changed.
# GitHub Pages then redeploys on its own. Run it by hand from the Actions tab: pick
# "Refresh news" and press "Run workflow". It also runs whenever the script or this file
# changes, so a new search term shows its effect right away.
name: Refresh news

on:
  schedule:
    - cron: '23 14 * * *'   # daily at 14:23 UTC, early morning in California
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-news.mjs
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: refresh-news

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for Urnov Lab news on the IGI site
        run: node scripts/fetch-news.mjs

      - name: Commit news.json if it changed
        run: |
          git add news.json
          if git diff --cached --quiet; then
            echo "news.json is unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh news from the IGI"
          git push
